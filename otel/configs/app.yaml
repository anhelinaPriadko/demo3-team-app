receivers:

  hostmetrics:
    collection_interval: 30s
    scrapers:
      cpu:
        metrics:
          system.cpu.utilization:
            enabled: true
      disk: {}
      load: {}
      filesystem:
        metrics:
          system.filesystem.utilization:
            enabled: true
        exclude_fs_types:
          fs_types: [autofs, binfmt_misc, bpf, cgroup2, configfs, debugfs, devpts, devtmpfs, fusectl, hugetlbfs, mqueue, nsfs, overlay, proc, pstore, securityfs, squashfs, sysfs, tmpfs, tracefs]
          match_type: strict
        exclude_mount_points:
          mount_points: ["^/snap/", "^/boot/efi$", "^/var/lib/docker/"]
          match_type: regexp
      memory:
        metrics:
          system.memory.utilization:
            enabled: true
      network: {}
      paging: {}
      processes: {}

  filelog/system:
    include:
      - /var/log/syslog
      - /var/log/auth.log
      - /var/log/kern.log
    start_at: end
    include_file_path: true

processors:
  memory_limiter:
    check_interval: 5s
    limit_percentage: 75
    spike_limit_percentage: 15
  resourcedetection/system:
    detectors: [system]
  resource:
    attributes:
      - key: deployment.environment
        value: demo3
        action: upsert
      # Host telemetry must not mix with the APM service "demo3-java-app" sent by the Java Agent
      - key: service.name
        value: demo3-app-host
        action: upsert
      - key: host.name
        value: "${env:OTEL_HOST_NAME}"
        action: upsert
  batch:
    timeout: 5s
    send_batch_size: 1024

exporters:
  otlp:
    endpoint: "${env:OTEL_EXPORTER_OTLP_ENDPOINT}"
    tls:
      insecure: true
    sending_queue:
      enabled: true
      queue_size: 5000
    retry_on_failure:
      enabled: true

service:
  pipelines:
    metrics:
      receivers: [hostmetrics]
      processors: [memory_limiter, resourcedetection/system, resource, batch]
      exporters: [otlp]
    logs:
      receivers: [filelog/system]
      processors: [memory_limiter, resourcedetection/system, resource, batch]
      exporters: [otlp]
