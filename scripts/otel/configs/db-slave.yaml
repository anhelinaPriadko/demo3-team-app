extensions:
  health_check:
    endpoint: 127.0.0.1:13133
receivers:
  hostmetrics:
    collection_interval: 30s
    root_path: /
    scrapers:
      cpu: {}
      load: {}
      memory: {}
      disk: {}
      filesystem:
        exclude_mount_points:
          mount_points: [/proc, /sys, /dev, /run]
          match_type: strict
      network: {}
      paging: {}
      processes: {}
  filelog/system:
    include: [/var/log/syslog, /var/log/auth.log]
    start_at: end
    include_file_path: true
  filelog/postgresql:
    include: [/var/log/postgresql/*.log]
    start_at: end
    include_file_path: true
  prometheus/postgresql:
    config:
      scrape_configs:
        - job_name: postgresql-exporter
          scrape_interval: 30s
          static_configs:
            - targets: ["127.0.0.1:9187"]

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 256
    spike_limit_mib: 64
  resourcedetection:
    detectors: [env, system]
    timeout: 5s
    override: false
  resource:
    attributes:
      - key: service.name
        value: postgresql
        action: upsert
      - key: deployment.environment
        value: demo3
        action: upsert
      - key: host.name
        value: __VM_NAME__
        action: upsert
      - key: host.ip
        value: __VM_PRIVATE_IP__
        action: upsert
      - key: service.instance.id
        value: __VM_NAME__
        action: upsert
      - key: database.role
        value: db-slave
        action: upsert
  batch:
    timeout: 5s
    send_batch_size: 1024

exporters:
  otlp:
    endpoint: 10.10.0.118:4317
    tls:
      insecure: true
    sending_queue:
      enabled: true
      queue_size: 5000
    retry_on_failure:
      enabled: true

service:
  extensions: [health_check]
  pipelines:
    metrics:
      receivers: [hostmetrics, prometheus/postgresql]
      processors: [memory_limiter, resourcedetection, resource, batch]
      exporters: [otlp]
    logs:
      receivers: [filelog/system, filelog/postgresql]
      processors: [memory_limiter, resourcedetection, resource, batch]
      exporters: [otlp]
