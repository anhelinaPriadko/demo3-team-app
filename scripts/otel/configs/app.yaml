
receivers:
  hostmetrics:
    collection_interval: 30s
    root_path: /
    scrapers:
      cpu:
      load:
      memory:
      disk:
      filesystem:
      network:
      paging:
      processes:

  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

  filelog/docker:
    include:
      - /var/lib/docker/containers/*/*-json.log
    start_at: end
    include_file_path: true

processors:
  memory_limiter:
    check_interval: 5s
    limit_mib: 256
    spike_limit_mib: 64

  resource:
    attributes:
      - key: service.name
        value: cinema-booking
        action: upsert
      - key: host.name
        value: __VM_NAME__
        action: upsert
      - key: deployment.environment
        value: demo3
        action: upsert

  batch:
    timeout: 10s
    send_batch_size: 512

exporters:
  debug:
    verbosity: basic

service:
  telemetry:
    logs:
      level: info

  pipelines:
    metrics:
      receivers: [hostmetrics, otlp]
      processors: [memory_limiter, resource, batch]
      exporters: [debug]

    traces:
      receivers: [otlp]
      processors: [memory_limiter, resource, batch]
      exporters: [debug]

    logs:
      receivers: [filelog/docker]
      processors: [memory_limiter, resource, batch]
      exporters: [debug]
