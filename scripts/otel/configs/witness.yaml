
receivers:
  hostmetrics:
    collection_interval: 30s
    root_path: /
    scrapers:
      cpu:
      load:
      memory:
      disk:
      filesystem:
      network:
      paging:
      processes:

  otlp:
    protocols:
      grpc:
        endpoint: 127.0.0.1:4317
      http:
        endpoint: 127.0.0.1:4318

processors:
  memory_limiter:
    check_interval: 5s
    limit_mib: 256
    spike_limit_mib: 64

  resource:
    attributes:
      - key: service.name
        value: etcd
        action: upsert
      - key: host.name
        value: __VM_NAME__
        action: upsert
      - key: database.cluster.role
        value: witness
        action: upsert
      - key: deployment.environment
        value: demo3
        action: upsert

  batch:
    timeout: 10s

exporters:
  debug:
    verbosity: basic

service:
  telemetry:
    logs:
      level: info

  pipelines:
    metrics:
      receivers: [hostmetrics]
      processors: [memory_limiter, resource, batch]
      exporters: [debug]

    traces:
      receivers: [otlp]
      processors: [memory_limiter, resource, batch]
      exporters: [debug]
