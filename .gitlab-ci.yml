stages:
  - validate
  - plan
  - apply

default:
  tags:
    - gcp
    - terraform
    - shell

variables:
  TF_DIR: "terraform/application-gcp"

before_script:
  - cd $TF_DIR
  - terraform init

terraform_validate:
  stage: validate
  script:
    - terraform validate

terraform_plan:
  stage: plan
  script:
    # - terraform apply -target=google_project_service.resourcemanager -auto-approve
    - terraform plan -out=tfplan
  artifacts:
    paths:
      - $TF_DIR/tfplan
    expire_in: 1 hour

terraform_apply:
  stage: apply
  script:
    - terraform apply -auto-approve tfplan
  when: manual
  only:
    - main