stages: [validate, plan, apply, verify, deploy, observe]

default:
  tags: [gcp, terraform, shell]

variables:
  TF_DIR: terraform/application-gcp
  TF_INPUT: "false"
  TF_IN_AUTOMATION: "true"
  GOOGLE_APPLICATION_CREDENTIALS: /home/gitlab-runner/gcp-credentials.json

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS && $CI_PIPELINE_SOURCE == "push"'
      when: never

    - if: '$CI_COMMIT_BRANCH'

.terraform:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'

  before_script:
    - terraform -chdir="$TF_DIR" init -input=false

terraform_validate:
  extends: .terraform
  stage: validate
  script:
    - terraform -chdir="$TF_DIR" validate
    - for file in ci/*.sh; do bash -n "$file"; done
    - python3 -c "import ast, pathlib; ast.parse(pathlib.Path('ci/nginx-upstream.py').read_text())"

terraform_plan:
  extends: .terraform
  stage: plan
  script:
    - terraform -chdir="$TF_DIR" plan -lock-timeout=5m -out=tfplan

  artifacts:
    access: maintainer
    paths:
      - $TF_DIR/tfplan
      - $TF_DIR/.terraform.lock.hcl
    expire_in: 1 day

terraform_apply:
  extends: .terraform
  stage: apply
  resource_group: demo3-infrastructure
  needs: [terraform_plan]

  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
      allow_failure: false

  script:
    - terraform -chdir="$TF_DIR" apply -lock-timeout=5m tfplan
    - mkdir -p inventory
    - terraform -chdir="$TF_DIR" output -json private_ips > inventory/ips.json
    - terraform -chdir="$TF_DIR" output -json app_private_ips > inventory/apps.json
    - terraform -chdir="$TF_DIR" output -json instance_names > inventory/names.json

  artifacts:
    paths: [inventory/]
    expire_in: 7 days

check_deploy_readiness:
  stage: verify
  needs: [terraform_apply]

  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

  script:
    - bash ci/check-readiness.sh

.delivery:
  stage: deploy
  resource_group: demo3-infrastructure
  timeout: 45m
  needs:
    - job: terraform_apply
      artifacts: true
    - job: check_deploy_readiness
      artifacts: false
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

deploy_application:
  extends: .delivery
  environment:
    name: production
  script:
    - bash ci/deploy.sh deploy

rollback_application:
  extends: .delivery
  environment:
    name: production
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
      allow_failure: true
  script:
    - bash ci/deploy.sh rollback

deploy_observability:
  stage: observe
  resource_group: demo3-infrastructure
  timeout: 45m
  needs:
    - job: terraform_apply
      artifacts: true
    - job: deploy_application
      artifacts: false
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  script:
    - bash ci/deploy-observability.sh